[project]
name = "magick"
version = "0.1.0"
description = "Ritual CLI for intentional action"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12",
]

[project.scripts]
magick = "magick.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["magick*"]
